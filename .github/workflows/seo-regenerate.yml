name: SEO marketing regeneration
on:
  push:
    branches: [seo/software-intent-top3]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/software-intent-top3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate public marketing pages
        run: python scripts/build-marketing.py
      - name: Verify generated pages
        run: |
          git diff --check
          node tests/marketing-launch.cjs
      - name: Commit generated output
        run: |
          if git diff --quiet; then
            echo "Generated output already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml business demo event-pass help privacy tent-layout-software tent-diagram-software party-rental-software event-rental-software tent-rental-software event-layout-software wedding-layout-planner marketing.css marketing.js assets/example-layout.svg
          git commit -m 'Regenerate RentSketch marketing pages from SEO source'
          git push origin HEAD:seo/software-intent-top3
