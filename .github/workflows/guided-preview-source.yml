name: Guided preview source snapshot
on:
  push:
    branches: [qa/guided-preview-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > /tmp/rentsketch-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: rentsketch-source
          path: /tmp/rentsketch-source.tgz
          retention-days: 1
