name: Finish guided preview regression coverage
on:
  push:
    branches: [feat/watch-only-guided-preview]
    paths: [.github/workflows/guided-readiness-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watch-only-guided-preview
      - shell: python
        run: |
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,s.count(old),old[:80]);p.write_text(s.replace(old,new))
          replace('js/ui/guided-preview.js', "var step = -1, lastRender = '', renderingKey = '', generation = 0, voiceOwned = false;", "var step = -1, lastRender = '', renderingKey = '', generation = 0, voiceOwned = false, lastPaint = -Infinity;")
          replace('js/ui/guided-preview.js','      last = now; render();','      last = now;\n      if (now - lastPaint >= 100) { lastPaint = now; render(); }')
          replace('tests/guided-preview-browser.cjs','await p.clock.runFor(240000);','await p.clock.fastForward(240000);')
          replace('tests/guided-preview-browser.cjs','   results.push({width,height,watchOnly:true,',"   console.log('PASS viewport',width,height);\n   results.push({width,height,watchOnly:true,")
          replace('tests/guided-preview-browser.cjs','  const fallback=await browser.newContext', '''  const waiting=await browser.newContext({viewport:{width:390,height:844}}),wp=await waiting.newPage();
            await wp.goto(base+'/fixture?tenant=friendly&focus=tent&autoplace=1');await wp.waitForTimeout(500);
            assert.equal(await wp.locator('.guided-preview').count(),0,'Exact rental must report ready first');
            await wp.evaluate(()=>{window.RENTSKETCH_PRODUCT_PREVIEW_READY=true;window.dispatchEvent(new CustomEvent('rentsketch:productPreviewReady'));});
            await wp.locator('.gp-plan svg').waitFor();results.push({waitsForExactRentalReady:true});await waiting.close();
            const fallback=await browser.newContext''')
      - run: |
          node --check js/ui/guided-preview.js
          node --check tests/guided-preview-browser.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/guided-preview.js tests/guided-preview-browser.cjs
          git diff --cached --check
          git commit -m 'Limit demonstration UI work and verify rental-ready and expiry boundaries'
          git push origin HEAD:feat/watch-only-guided-preview
