name: Guided preview public integration
on:
  push:
    branches: [qa/guided-preview-integration]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/public-qa --no-save playwright@1.56.1
      - run: /tmp/public-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/public-qa/node_modules node tests/guided-public-browser.cjs
        env:
          GUIDED_USE_WORKTREE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-public-evidence
          path: qa-guided-live/
