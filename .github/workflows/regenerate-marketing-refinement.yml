name: Regenerate marketing refinement
on:
  push:
    branches: [seo/software-query-refinement-20260922]
    paths: [.github/workflows/regenerate-marketing-refinement.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/software-query-refinement-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/build-marketing.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add party-rental-software/index.html event-rental-software/index.html tent-rental-software/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated marketing files already aligned."
          else
            git commit -m "Regenerate refined marketing pages"
            git push origin HEAD:seo/software-query-refinement-20260922
          fi
