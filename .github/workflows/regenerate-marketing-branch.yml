name: Regenerate marketing branch
on:
  push:
    branches: [seo/rental-software-intent-rebuild]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/rental-software-intent-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m py_compile scripts/build-marketing.py
      - run: python3 scripts/build-marketing.py
      - run: npm --prefix tests ci
      - run: npm --prefix tests run test:marketing
      - run: |
          rm .github/workflows/regenerate-marketing-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Rebuild marketing pages for rental software intent'
          git push origin HEAD:seo/rental-software-intent-rebuild
