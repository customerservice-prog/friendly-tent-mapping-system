name: Apply reviewed mobile source fixes
on:
  push:
    branches: [fix/mobile-event-pass-20260921]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-event-pass-20260921
          fetch-depth: 0
      - name: Apply the reviewed source patch
        shell: python
        run: |
          import subprocess, textwrap
          from pathlib import Path
          if "var purchaseRequested =" not in Path('js/ui/paywall.js').read_text():
              original = subprocess.check_output(['git','show','af3ca1a6010caf6aae5d4d5972a445371f47fb34:.github/workflows/apply-mobile-access-fix.yml'], text=True)
              script = original.split('        run: |\n',1)[1].split('      - name: Commit only reviewed source and tests',1)[0]
              exec(compile(textwrap.dedent(script), '<reviewed-patch>', 'exec'))
      - name: Commit source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/paywall.js event-pass.css my-event/access.js my-event/index.html designer/index.html tests/mobile-access-browser.cjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix mobile purchase dialog, direct paid entry, and booking connection errors"
            git push origin HEAD:fix/mobile-event-pass-20260921
          fi
