name: Regenerate SEO pages
on:
  push:
    branches: [seo/software-intent-rebuild]
    paths: [.github/workflows/regenerate-seo-pages.yml]
permissions:
  contents: write
jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/software-intent-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-marketing.py
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html business demo help privacy event-pass tent-layout-software tent-diagram-software party-rental-software event-rental-software tent-rental-software event-layout-software wedding-layout-planner sitemap.xml marketing.css
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate rental software SEO pages"
            git push origin HEAD:seo/software-intent-rebuild
          fi
