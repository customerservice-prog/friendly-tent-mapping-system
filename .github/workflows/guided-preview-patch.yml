name: Apply guided preview integration
on:
  push:
    branches: [feat/watch-only-guided-preview]
    paths: [.github/workflows/guided-preview-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watch-only-guided-preview
      - name: Apply exact scoped integration
        shell: python
        run: |
          from pathlib import Path
          def change(path, old, new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,s.count(old));p.write_text(s.replace(old,new))
          change('js/ui/guided-preview.js', 'rentssketch:previewExpired', 'rentsketch:previewExpired')
          change('js/ui/view3d.js','  active=api;return api;','  // A watch-only sample must not replace the real designer renderer.\n  if(callbacks.registerActive !== false)active=api;return api;')
          change('js/ui/preview-limit.js',"      document.body.classList.add('rs-preview-expired');", "      document.body.classList.add('rs-preview-expired');\n      window.dispatchEvent(new CustomEvent('rentsketch:previewExpired'));")
          change('js/ui/preview-limit.js','focusIfLocked: focusIfLocked };', 'focusIfLocked: focusIfLocked, remainingSeconds: function () { return Math.ceil(remaining() / 1000); } };')
          change('js/ui/paywall.js',"  var offer, verified, savedPaidEvent, modal, offerPromise, previewLimit, ready = false, busy = false;", """  var offer, verified, savedPaidEvent, modal, offerPromise, previewLimit, ready = false, busy = false;
            var guidedAutoAttempted = false;
            function showGuidedPreview() {
              if (!offer?.required || active() || savedPaidEvent || (returning && !verified) || verified?.renewable || verified?.includedWithOrder || document.body.classList.contains('rs-preview-expired')) return;
              window.RentSketchGuidedPreview?.open({
                hasAccess: function () { return canEdit(); },
                price: function () { return money(offer.priceCents); }, days: function () { return offer.durationDays; },
                remaining: function () { return previewLimit?.remainingSeconds(); },
                purchase: requestAccess,
              });
            }""")
          change('js/ui/paywall.js',"    var previewButton = document.getElementById('designMyEvent');", """    if (!active() && !savedPaidEvent && !verified?.renewable && !verified?.includedWithOrder && !bar.querySelector('[data-guided-preview]')) {
                var guide = document.createElement('button'); guide.type = 'button'; guide.className = 'pass-recover'; guide.dataset.guidedPreview = ''; guide.textContent = 'Watch how it works'; guide.onclick = showGuidedPreview; bar.appendChild(guide);
              }
              var previewButton = document.getElementById('designMyEvent');""")
          change('js/ui/paywall.js','  async function requestAccess(continuation) {','  async function requestAccess(continuation) {\n    window.RentSketchGuidedPreview?.close();')
          change('js/ui/paywall.js',"      // A priced purchase link opens the offer, never a charge. Restore", """      // Only free new previews get the public sample. Restore/buy entry and
                // already-paid/booked designs retain their existing flow. No demo scene
                // is ever loaded into the real editor or autosave.
                if (!guidedAutoAttempted && !purchaseRequested && !checkoutId && !draftToken && !recoveryToken && !modal) {
                  guidedAutoAttempted = true; showGuidedPreview();
                }
                // A priced purchase link opens the offer, never a charge. Restore""")
          change('designer/index.html','<script src="../js/ui/paywall.js?v=20260921-mobile-access-1"></script>','<script src="../js/ui/guided-preview.js?v=20260921-guided-1"></script><script src="../js/ui/paywall.js?v=20260921-guided-1"></script>')
          change('designer/index.html','<link rel="stylesheet" href="../event-pass.css?v=20260921-mobile-access-1">','<link rel="stylesheet" href="../event-pass.css?v=20260921-mobile-access-1"><link rel="stylesheet" href="../guided-preview.css?v=20260921-guided-1">')
          change('designer/index.html','../js/ui/preview-limit.js?v=20260920-preview-1','../js/ui/preview-limit.js?v=20260921-guided-1')
          change('designer/index.html','../js/ui/view3d.js?v=20260920-preview-1','../js/ui/view3d.js?v=20260921-guided-1')
      - name: Check and commit reviewed source only
        run: |
          node --check js/ui/guided-preview.js
          node --check js/ui/paywall.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ui/guided-preview.js js/ui/paywall.js js/ui/preview-limit.js js/ui/view3d.js designer/index.html
          git diff --cached --check
          git commit -m 'Start isolated walkthrough only for free previews and preserve editor renderer'
          git push origin HEAD:feat/watch-only-guided-preview
