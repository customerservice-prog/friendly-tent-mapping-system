name: Watch-only guided preview QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guided-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tests ci
      - run: npm --prefix tests run test:event-pass
      - run: node tests/marketing-launch.cjs
      - run: node --experimental-vm-modules tests/marketing-tour.cjs
      - run: npm install --prefix /tmp/guided-qa --no-save playwright@1.56.1
      - run: /tmp/guided-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/guided-qa/node_modules node tests/platform-console-browser.cjs
      - run: NODE_PATH=/tmp/guided-qa/node_modules node tests/tenant-workspace-browser.cjs
      - run: NODE_PATH=/tmp/guided-qa/node_modules node tests/guided-preview-browser.cjs
      - run: NODE_PATH=/tmp/guided-qa/node_modules node tests/wedding-story-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-preview-evidence
          path: |
            qa-platform-console/
            qa-tenant-workspace/
            qa-guided-preview/
            qa-wedding-story/
