name: Tent walkthrough regression

on:
  pull_request:
    paths:
      - 'js/ui/tent-setup3d.js'
      - 'js/ui/view3d.js'
      - 'script.js'
      - 'tent-setup-walkthrough.css'
      - 'designer/index.html'
      - 'tests/tent-setup3d.test.mjs'
      - 'tests/scene-interaction.cjs'
      - '.github/workflows/tent-walkthrough-regression.yml'

jobs:
  tent-walkthrough:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: node --test tent-setup3d.test.mjs
      - run: node --experimental-vm-modules scene-interaction.cjs
