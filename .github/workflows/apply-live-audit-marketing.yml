name: Apply live-audit marketing regeneration
on:
  push:
    branches: [seo/live-audit-polish-20260922]
    paths:
      - '.github/workflows/apply-live-audit-marketing.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/live-audit-polish-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-marketing.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Regenerate marketing pages after live SEO audit'
          git push origin HEAD:seo/live-audit-polish-20260922
