name: Apply SEO generator rebuild
on:
  push:
    branches: [seo/software-intent-indexing-20260922]
    paths: [.github/workflows/apply-seo-rebuild.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/software-intent-indexing-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build-marketing.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html party-rental-software party-rental-management-software party-rental-inventory-software event-rental-software tent-rental-software sitemap.xml event-pass help privacy 404.html assets/example-layout.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild SEO marketing pages'
            git push origin HEAD:seo/software-intent-indexing-20260922
          fi
