name: Production Lighthouse smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse
        run: npm install --global lighthouse@12.2.1

      - name: Run production audits
        run: |
          mkdir -p lighthouse-reports
          lighthouse https://rentsketch.com/             --chrome-flags="--headless --no-sandbox --disable-gpu"             --output=json --output-path=lighthouse-reports/home.json --quiet
          lighthouse https://rentsketch.com/party-rental-software/             --chrome-flags="--headless --no-sandbox --disable-gpu"             --output=json --output-path=lighthouse-reports/party-rental-software.json --quiet
          lighthouse https://rentsketch.com/event-pass/             --chrome-flags="--headless --no-sandbox --disable-gpu"             --output=json --output-path=lighthouse-reports/event-pass.json --quiet

      - name: Check severe regressions
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          rows = []

          for path in sorted(pathlib.Path('lighthouse-reports').glob('*.json')):
              data = json.loads(path.read_text())
              cats = data.get('categories', {})
              audits = data.get('audits', {})
              perf = float(cats.get('performance', {}).get('score') or 0)
              a11y = float(cats.get('accessibility', {}).get('score') or 0)
              bp = float(cats.get('best-practices', {}).get('score') or 0)
              seo = float(cats.get('seo', {}).get('score') or 0)
              lcp = float(audits.get('largest-contentful-paint', {}).get('numericValue') or 0)
              cls = float(audits.get('cumulative-layout-shift', {}).get('numericValue') or 0)
              tbt = float(audits.get('total-blocking-time', {}).get('numericValue') or 0)

              rows.append((path.stem, perf, a11y, bp, seo, lcp, cls, tbt))

              if perf < 0.60:
                  failures.append(f'{path.stem}: performance {perf:.2f} < 0.60')
              if a11y < 0.85:
                  failures.append(f'{path.stem}: accessibility {a11y:.2f} < 0.85')
              if seo < 0.85:
                  failures.append(f'{path.stem}: SEO {seo:.2f} < 0.85')
              if lcp > 6000:
                  failures.append(f'{path.stem}: LCP {lcp:.0f}ms > 6000ms')
              if cls > 0.35:
                  failures.append(f'{path.stem}: CLS {cls:.3f} > 0.35')
              if tbt > 1500:
                  failures.append(f'{path.stem}: TBT {tbt:.0f}ms > 1500ms')

          print('page | perf | a11y | best | seo | LCP ms | CLS | TBT ms')
          for row in rows:
              print(f'{row[0]} | {row[1]:.2f} | {row[2]:.2f} | {row[3]:.2f} | {row[4]:.2f} | {row[5]:.0f} | {row[6]:.3f} | {row[7]:.0f}')

          if failures:
              print('\nSevere Lighthouse regression(s):')
              for item in failures:
                  print('- ' + item)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-production-reports
          path: lighthouse-reports/
          if-no-files-found: error
