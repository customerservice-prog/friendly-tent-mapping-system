name: Rebuild query hub pages
on:
  push:
    branches: [seo/query-hub-and-checkout-trust]
    paths:
      - '.github/workflows/rebuild-query-hub-pages.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/query-hub-and-checkout-trust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m py_compile scripts/build-marketing.py
      - run: npm --prefix tests ci
      - run: python3 scripts/build-marketing.py
      - run: npm --prefix tests run test:marketing
      - run: npm --prefix tests run test:event-pass
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html party-rental-software party-rental-management-software party-rental-inventory-software event-rental-software tent-rental-software tent-layout-software tent-diagram-software event-layout-software wedding-layout-planner event-pass help privacy business demo 404.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m 'Regenerate marketing pages for search-intent hub'
            git push origin HEAD:seo/query-hub-and-checkout-trust
          fi
