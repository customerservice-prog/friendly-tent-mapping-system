<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset RentSketch Password</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0b1a2e,#14294a);color:#1b2431;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:36px;width:min(430px,100%);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.brand{font-weight:800;color:#2f6fed;margin-bottom:8px}.muted{color:#5b6b84;line-height:1.5}
label{display:block;font-size:13px;color:#46536a;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cfd8e5;border-radius:8px;font-size:15px}
button{margin-top:20px;background:#2f6fed;color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.msg{margin-top:16px;padding:11px 13px;border-radius:8px;font-size:14px}.err{background:#fdecea;color:#9c2b1f;border:1px solid #f3c2bd}.ok{background:#e9f7ee;color:#1f7a3d;border:1px solid #bfe6cc}
</style>
</head>
<body>
<main class="card">
<div class="brand">RentSketch</div>
<h1>Set a new admin password</h1>
<p class="muted">Choose a password with at least 12 characters. This reset link works once and then expires.</p>
<form id="form">
<label for="pw1">New password</label>
<input id="pw1" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
<label for="pw2">Confirm new password</label>
<input id="pw2" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
<button id="submit" type="submit">Set new password</button>
<div id="msg" class="msg" hidden></div>
</form>
</main>
<script>
(function(){
  var API='https://rentsketch-api-production.up.railway.app';
  var token=(location.hash.match(/(?:^#|&)token=([^&]+)/)||[])[1]||'';
  try{token=decodeURIComponent(token);}catch(_){}
  var form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
  function show(text,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=text;}
  if(!token){show('This reset link is missing its one-time token.',false);btn.disabled=true;}
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;
    if(a!==b)return show('Passwords do not match.',false);
    if(a.length<12)return show('Password must be at least 12 characters.',false);
    btn.disabled=true;btn.textContent='Saving…';msg.hidden=true;
    try{
      var r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({token:token,newPassword:a})});
      var d=await r.json().catch(function(){return{};});
      if(!r.ok)throw new Error(d.error||'Password reset failed');
      history.replaceState(null,'',location.pathname);
      show('Password updated. Redirecting to login…',true);
      setTimeout(function(){location.href='/dashboard/#/login';},1200);
    }catch(err){show(err.message||'Password reset failed',false);btn.disabled=false;btn.textContent='Set new password';}
  });
})();
</script>
</body>
</html>
