<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentSketch Account Security</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f4f6f9;color:#1b2431}.wrap{max-width:520px;margin:70px auto;padding:24px}.card{background:#fff;border:1px solid #e3e8ee;border-radius:12px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}h1{margin:0 0 8px}.sub{color:#5b6b84;margin-bottom:24px}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid #d3dae4;border-radius:7px;font-size:15px}button{margin-top:18px;background:#2f6fed;color:#fff;border:0;padding:11px 18px;border-radius:7px;font-weight:600;cursor:pointer}.msg{margin-top:16px;padding:10px 12px;border-radius:7px;display:none}.ok{display:block;background:#e9f7ee;color:#1f7a3d}.err{display:block;background:#fdecea;color:#9c2b1f}.back{display:inline-block;margin-top:18px;color:#2f6fed;text-decoration:none}</style></head><body><div class="wrap"><div class="card"><h1>Account Security</h1><div class="sub">Change your RentSketch dashboard password.</div><form id="f"><label>Current password</label><input id="current" type="password" autocomplete="current-password" required><label>New password</label><input id="next" type="password" autocomplete="new-password" minlength="12" required><label>Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="save">Change password</button><div id="msg" class="msg"></div></form><a class="back" href="/dashboard/#/login">Sign in</a></div></div><script src="/js/ui/dashboard-session.js?v=20260926-security-1"></script><script src="/dashboard/account.js?v=20260926-security-1"></script></body></html>
