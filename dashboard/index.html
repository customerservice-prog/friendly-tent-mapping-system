<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RentSketch Business Dashboard</title><link rel="icon" type="image/png" href="../logo.png"><style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f6f9;color:#1b2431}.dash-shell{min-height:100vh;display:flex;flex-direction:column}.dash-header{display:flex;align-items:center;gap:24px;padding:14px 24px;background:#0b1a2e;color:#fff;flex-wrap:wrap}.dash-brand{font-weight:700;font-size:18px}.dash-brand-sub{font-weight:400;font-size:13px;color:#9fb4d0;margin-left:6px}.dash-nav{display:flex;gap:4px;flex-wrap:wrap}.nav-link{color:#cbd8ec;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:14px}.nav-link:hover{background:#16294a}.nav-link.active{background:#2f6fed;color:#fff}.dash-account{margin-left:auto;display:flex;align-items:center;gap:10px}.tenant-name,.tenant-switch{color:#cbd8ec;font-size:13px}.tenant-switch{background:#16294a;border:1px solid #2a3f63;color:#fff;padding:6px 8px;border-radius:6px}.btn-logout{background:transparent;border:1px solid #3a5578;color:#dbe9ff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.dash-main{flex:1;padding:28px 32px 60px;max-width:1080px;width:100%;margin:0 auto}.dash-title{font-size:26px;margin:0 0 4px}.dash-subtitle{color:#5b6b84;margin:0 0 24px;font-size:14px}.trial-banner{background:#fff4e5;border:1px solid #f0b95a;color:#8a5a00;padding:10px 14px;border-radius:8px;font-size:14px;margin:0 0 20px}.trial-banner.trial-expired{background:#fdecea;border-color:#e57373;color:#a12622}.dash-section-title{font-size:18px;margin:32px 0 14px}.dash-loading{color:#5b6b84;padding:40px 0;text-align:center}.dash-empty{background:#fff;border:1px dashed #cfd8e3;border-radius:8px;padding:24px;color:#5b6b84;text-align:center}.dash-error{background:#fdecea;color:#9c2b1f;border:1px solid #f3c2bd;border-radius:6px;padding:10px 14px;font-size:14px;margin:10px 0}.dash-saved{background:#e9f7ee;color:#1f7a3d;border:1px solid #bfe6cc;border-radius:6px;padding:10px 14px;font-size:14px;margin:10px 0}.stat-row{display:flex;gap:16px;flex-wrap:wrap}.stat-card{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:18px 24px;min-width:160px}.stat-num{font-size:30px;font-weight:700;color:#2f6fed}.stat-label{font-size:13px;color:#5b6b84;margin-top:4px}.dash-more{margin-top:12px}.dash-more a{color:#2f6fed;text-decoration:none;font-size:14px}.dash-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #e3e8ee}.dash-table th,.dash-table td{padding:10px 14px;text-align:left;border-bottom:1px solid #eef1f5;font-size:14px}.dash-table th{background:#f8f9fb;font-weight:600;color:#46536a;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.muted{color:#8a97ab;font-size:12px}.status-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;text-transform:capitalize;background:#eef1f5;color:#46536a}.status-select{padding:5px 8px;border-radius:6px;border:1px solid #d3dae4;font-size:13px}.dash-form{background:#fff;border:1px solid #e3e8ee;border-radius:10px;padding:22px;max-width:560px;display:flex;flex-direction:column;gap:14px}.dash-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#46536a}.dash-form label.checkbox-row{flex-direction:row;align-items:center;gap:8px}.dash-form input,.dash-form textarea{padding:9px 10px;border:1px solid #d3dae4;border-radius:6px;font-size:14px;font-family:inherit}.btn-primary{background:#2f6fed;color:#fff;border:none;padding:10px 18px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;align-self:flex-start}.btn-primary:disabled{opacity:.6}.btn-link{background:none;border:none;color:#2f6fed;cursor:pointer;font-size:13px;padding:0}.btn-link.btn-danger{color:#c0392b}.code-box,#originsBox{width:100%;max-width:760px;font-family:Consolas,monospace;font-size:13px;padding:10px;border-radius:6px;border:1px solid #d3dae4}.code-box{background:#0b1a2e;color:#d9e6ff;display:block;margin:8px 0 20px}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0b1a2e,#14294a)}.login-card{background:#fff;border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login-brand{font-weight:700;color:#2f6fed;font-size:15px;margin-bottom:6px}.login-card h1{font-size:22px;margin:0 0 8px}.login-sub{color:#5b6b84;font-size:14px;margin:0 0 22px}.login-card form{display:flex;flex-direction:column;gap:14px}.login-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#46536a}.login-card input{padding:10px 12px;border:1px solid #d3dae4;border-radius:6px;font-size:14px}@media(max-width:700px){.dash-main{padding:20px 14px 50px}.dash-header{padding:12px}.dash-account{margin-left:0}.login-card{margin:16px;padding:28px}}</style></head><body><div id="app"></div><script src="app.js"></script><script src="account-link.js"></script></body></html>
