<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentSketch responsive QA</title>
<style>body{margin:0;font:14px system-ui;background:#e9ecf0;color:#22324a}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:white;position:sticky;top:0;z-index:2}select{padding:8px;font:inherit}main{padding:18px;display:flex;justify-content:center}iframe{display:block;border:1px solid #bec8c0;background:white;box-shadow:0 8px 28px #25354620;flex-shrink:0}p{margin:0;color:#687789;font-size:12px}</style>
<header><strong>Responsive QA</strong><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="320,640">320 × 640</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390</option><option value="1440,900">1440 × 900</option></select></label><label>Entry <select id="entry"><optgroup label="Friendly tent previews"><option value="20x20-pole-tent">20x20 Pole Tent</option><option value="10-x-10-ez-pop-up-canopy-tent">10 x 10 EZ Pop Up Canopy Tent</option><option value="10-x-20-ez-pop-up-canopy-tent">10 x 20 EZ Pop Up Canopy Tent</option><option value="20-x-20-frame-tent">20 x 20 Frame Tent</option><option value="20-x-30-frame-tent">20 x 30 Frame Tent</option><option value="20-x-40-frame-tent">20 x 40 Frame Tent</option><option value="20x30-pole-tent">20x30 Pole Tent</option><option value="20x40-pole-tent">20x40 Pole Tent</option><option value="30-x-30-pole-tent">30 x 30 Pole Tent</option><option value="30-x-45-pole-tent">30 x 45 Pole Tent</option><option value="30-x-60-pole-tent">30 x 60 Pole Tent</option><option value="30x40-classic-frame-tent">30x40 Classic Frame Tent</option><option value="40-x-100-pole-tent">40 x 100 Pole Tent</option><option value="40-x-40-pole-tent">40 x 40 Pole Tent</option><option value="40-x-80-pole-tent">40 x 80 Pole Tent</option><option value="40x60-pole-tent">40x60 Pole Tent</option><option value="tent-misting-10x10-pop-up-tent">Tent Misting 10x10 Pop Up Tent</option></optgroup><optgroup label="Friendly inflatable previews"><option value="inflatable:crayon-bounce-house">Crayon Bounce House</option><option value="inflatable:pink-inflatable-bounce-house">Pink Inflatable Bounce House</option><option value="inflatable:pirate-ship-slide-combo-bounce-house">Pirate Ship Slide Combo Bounce House</option><option value="inflatable:patriotic-red-white-and-blue-bounce-house">Patriotic Red, White and Blue Bounce House</option><option value="inflatable:fire-red-marble-inflatable-water-slide">Fire Red Marble Inflatable Water Slide</option><option value="inflatable:wedding-white-bounce-house">Wedding White Bounce House</option><option value="inflatable:fire-truck-water-slide-bounce-house">Fire Truck Water Slide Bounce House</option><option value="inflatable:22ft-tropical-lava-wave-marble-waterslide">22ft Tropical Lava Wave Marble Waterslide</option><option value="inflatable:rainbow-castle-bounce-house">Rainbow Castle Bounce House</option><option value="inflatable:tidal-wave-inflatable-water-slide">Tidal Wave Inflatable Water Slide</option><option value="inflatable:18ft-purple-tropical-marble-double-bay-waterslide">18ft Purple Tropical Marble Double Bay Waterslide</option></optgroup><optgroup label="Other entry points"><option value="designer">Friendly direct designer</option><option value="generic">RentSketch direct designer</option><option value="demo">RentSketch demo</option><option value="home">RentSketch homepage</option><option value="friendly-home">Friendly homepage</option><option value="friendly-design">Friendly Design Your Event</option></optgroup></select></label><button id="reload" type="button">Reload preview</button><p>CSS viewport check. This does not emulate phone hardware or touch. Do not submit quotes.</p></header>
<main><iframe title="Responsive designer preview" id="preview"></iframe></main>
<script>
const frame=document.getElementById('preview'),size=document.getElementById('size'),entry=document.getElementById('entry');
function resize(){const [width,height]=size.value.split(',');frame.style.width=width+'px';frame.style.height=height+'px';}
function load(){const q=new URLSearchParams({tenant:'friendly',view:'2d',v:'20260920-inflatables-1'});const routes={home:'/',demo:'/demo/',generic:'/designer/', 'friendly-home':'https://www.friendlypartyrental.com/', 'friendly-design':'https://www.friendlypartyrental.com/design-your-event'};if(routes[entry.value])frame.src=routes[entry.value];else{if(entry.value.startsWith('inflatable:')){q.set('focus','inflatable');q.set('autoplace','1');q.set('productSlug',entry.value.slice(11));}else if(entry.value!=='designer'){q.set('focus','tent');q.set('autoplace','1');q.set('tentSlug',entry.value);}frame.src='/designer/?'+q;}resize();}
size.onchange=resize;entry.onchange=load;document.getElementById('reload').onclick=load;load();
</script></html>
