{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}

<body>
<header class="site-header">
  <img src="../logo.png" alt="RentSketch Designer" class="site-header-logo" id="siteHeaderLogo">
      <h1 id="siteHeaderTitle">RentSketch Designer</h1>
    <p id="siteHeaderTagline">Plan tents, tables, chairs, dance floors and more in a real-scale event layout.</p>
  </header>

  <script type="module">
import { getTenant, GENERIC_TENANT, TENTS, TABLES, CHAIRS } from '../js/data/tenant.js';
import { LINENS, linenVisual } from '../js/data/linens.js';
import { LIGHTING_OPTIONS, TENT_LIGHTING_PRICE_BY_SIZE } from '../js/data/lighting.js';
import { DANCE_SECTION } from '../js/data/danceFloor.js';
var params = new URLSearchParams(window.location.search);
var tenantSlug = params.get('tenant');
var isEmbed = params.get('embed') === '1';
    var effectiveSlug = tenantSlug || 'generic';
          var isKnownStatic = effectiveSlug === 'friendly' || effectiveSlug === 'generic';
    var tenant = isKnownStatic ? getTenant(effectiveSlug) : Object.assign({}, GENERIC_TENANT, {
      id: tenantSlug, slug: tenantSlug, name: 'RentSketch', tagline: '', contactEmail: '', phone: '', showPackages: false,
    });
    window.ACTIVE_TENANT = tenant;
          window.RENTSKETCH_TENANT_SLUG = effectiveSlug;
          // The generic/no-tenant RentSketch experience has no real business
          // behind it, so it must never show pricing - do this unconditionally
          // (not inside the products fetch below) so it still holds even if
          // that request 404s, is slow, or fails outright.
          if (effectiveSlug === 'generic') {
            [TENTS, TABLES, CHAIRS].forEach(function (list) {
              list.forEach(function (item) { item.pricePerDay = null; });\n            });\n          }
    // Dance floor / lighting / linens have no per-tenant catalog wiring yet
    // (unlike tents/tables/chairs, which get overwritten by real per-tenant
    // product data below). Until that exists, showing Friendly Party Rental's
    // own numbers to any other tenant - including a brand new business with no
    // catalog at all - would misrepresent someone else's pricing as that
    // tenant's own. Only the real Friendly tenant keeps its real numbers here;
    // every other tenant sees "Ask for pricing" for these categories until real
    // per-tenant pricing for them is built.
    if (effectiveSlug !== 'friendly') {
      LINENS.forEach(function (item) { item.pricePerDay = null; });
      LIGHTING_OPTIONS.forEach(function (item) { if (item.id !== 'lighting-none') item.pricePerDay = null; });
      Object.keys(TENT_LIGHTING_PRICE_BY_SIZE).forEach(function (k) { TENT_LIGHTING_PRICE_BY_SIZE[k] = null; });
      DANCE_SECTION.pricePerDay = null;
    }
    window.RENTSKETCH_API_URL = window.RENTSKETCH_API_URL || 'https://rentsketch-api-production.up.railway.app';
    window.RENTSKETCH_EMBED = isEmbed;
    var titleEl = document.getElementById('siteHeaderTitle');
    var taglineEl = document.getElementById('siteHeaderTagline');
    var logoEl = document.getElementById('siteHeaderLogo');
    var disclaimerEl = document.getElementById('quoteDisclaimer');
    var footerEl = document.getElementById('siteFooterText');
    function applyBranding(t) {
      var generic = t.slug === 'generic';
      document.title = generic ? 'RentSketch Designer' : (t.name + ' Event Designer | ' + t.name);
      if (disclaimerEl) {
        disclaimerEl.textContent = 'This creates a draft request only. ' + (t.name || 'This company') + ' will confirm final pricing, availability, and details before anything is booked or charged.';
      }
      if (titleEl) titleEl.textContent = generic ? 'RentSketch Designer' : (t.name + ' Event Designer');
      if (taglineEl) taglineEl.textContent = t.tagline || '';
      if (logoEl && t.logo) logoEl.src = /^https?:/.test(t.logo) ? t.logo : ('../' + t.logo);
      if (logoEl) logoEl.alt = t.name;
      if (footerEl) {
        var bits = [t.name];
        if (t.phone) bits.push(t.phone);
        if (t.contactEmail) bits.push(t.contactEmail);
        footerEl.textContent = bits.join(' \u00b7 ');
      }
      var root = document.documentElement.style;
      if (t.colors) {
        if (t.colors.primary) root.setProperty('--brand-primary', t.colors.primary);
        if (t.colors.primaryDark) root.setProperty('--brand-primary-dark', t.colors.primaryDark);
        if (t.colors.primaryTint) root.setProperty('--brand-primary-tint', t.colors.primaryTint);
        if (t.colors.secondary) root.setProperty('--brand-secondary', t.colors.secondary);
      }
      document.body.classList.toggle('embed-mode', !!window.RENTSKETCH_EMBED);
    }
    applyBranding(tenant);
    (function () {
      var embedStyle = document.createElement('style');
      embedStyle.textContent = 'body.embed-mode .site-header{display:none;}body.embed-mode .site-footer{display:none;}';\ndocument.head.appendChild(embedStyle);
    })();
    
    if (window.RENTSKETCH_API_URL && window.RENTSKETCH_TENANT_SLUG) {
      fetch(window.RENTSKETCH_API_URL + '/api/tenants/' + encodeURIComponent(window.RENTSKETCH_TENANT_SLUG))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (live) {
        if (!live) return;
        tenant.name = live.name || tenant.name;
        tenant.tagline = live.tagline || tenant.tagline;
        tenant.contactEmail = live.contactEmail || tenant.contactEmail;
        tenant.phone = live.phone || tenant.phone;
        if (live.logoUrl) tenant.logo = live.logoUrl;
        tenant.colors = tenant.colors || {};
        if (live.primaryColor) tenant.colors.primary = live.primaryColor;
        if (live.secondaryColor) tenant.colors.secondary = live.secondaryColor;
        tenant.poweredByEnabled = live.poweredByEnabled;
        applyBranding(tenant);
      })
      .catch(function () {});
fetch(window.RENTSKETCH_API_URL + '/api/tenants/' + encodeURIComponent(window.RENTSKETCH_TENANT_SLUG) + '/products')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.products) return;
      // Dance floor / lighting / linen per-tenant pricing.
      // Unlike tent/table/chair (which are rebuilt as per-tenant arrays of
      // distinct products), these are shared singleton/fixed-list catalog
      // objects - there is exactly one DANCE_SECTION and a fixed set of
      // LIGHTING_OPTIONS / LINENS "shapes" that every tenant reuses. So
      // instead of rebuilding arrays, we mutate the existing shared objects
      // in place, using the same Visual picker (visual_model_id) tenants
      // already use for tent/table/chair. A tenant with no matching product
      // leaves these at whatever the earlier "strip pricing for non-Friendly
      // tenants" step above already set (i.e. no price shown).
      (function applyCategoryPricing() {
        function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }
        var byVisual = {};
        data.products.forEach(function (p) {
          if (p.active === false || !p.visual_model_id) return;
          if (!byVisual[p.visual_model_id]) byVisual[p.visual_model_id] = p;
        });

        // Dance floor: one shared master item, one visual ('dance-floor').
        var danceProduct = byVisual['dance-floor'];
        if (danceProduct && norm(danceProduct.category) === 'dancefloor') {
          DANCE_SECTION.pricePerDay = (danceProduct.price_per_day !== null && danceProduct.price_per_day !== undefined) ? Number(danceProduct.price_per_day) : null;
        }

        // Lighting: LIGHTING_OPTIONS ids already match the visual-library lighting ids 1:1.
        LIGHTING_OPTIONS.forEach(function (opt) {
          if (opt.id === 'lighting-none') return; // always free, not a real rentable item
          var p = byVisual[opt.id];
          if (p && norm(p.category) === 'lighting') {
            opt.pricePerDay = (p.price_per_day !== null && p.price_per_day !== undefined) ? Number(p.price_per_day) : null;
            if (opt.id === 'lighting-tent') {
              // The master catalog prices tent lighting per tent size; a
              // tenant product today only carries one flat per-day price,
              // so apply it uniformly across every tent size rather than
              // mixing a real tenant price with stale Friendly numbers.
              Object.keys(TENT_LIGHTING_PRICE_BY_SIZE).forEach(function (k) { TENT_LIGHTING_PRICE_BY_SIZE[k] = opt.pricePerDay; });
            }
          }
        });

        // Linens: the visual library groups linens into 3 shared rendering
        // shapes (round skirt / rectangular skirt / runner), each exposed as
        // visual id "linen-" + shape key (e.g. 'linen-skirt-round'), rather
        // than one visual per exact product. A tenant prices per shape and
        // that price applies to every catalog linen using that shape. Items
        // with no shape mapping (napkins, chair covers) are not priced
        // per-tenant yet.
        LINENS.forEach(function (item) {
          var shapeKey = linenVisual(item.id);
          var visualId = shapeKey ? ('linen-' + shapeKey) : null;
          var p = visualId ? byVisual[visualId] : null;
          if (p && norm(p.category) === 'linen') {
            item.pricePerDay = (p.price_per_day !== null && p.price_per_day !== undefined) ? Number(p.price_per_day) : null;
          }
        });
      })();

        if (!isKnownStatic) {
          var masterByCategory = {
            chair: CHAIRS.map(function (x) { return JSON.parse(JSON.stringify(x)); }),
            table: TABLES.map(function (x) { return JSON.parse(JSON.stringify(x)); }),
            tent: TENTS.map(function (x) { return JSON.parse(JSON.stringify(x)); })
          };
          var liveArrays = { chair: CHAIRS, table: TABLES, tent: TENTS };
          var unmapped = [];
          Object.keys(liveArrays).forEach(function (cat) {
            var resolved = [];
            data.products.forEach(function (p) {
              if (p.category !== cat || p.active === false) return;
              if (!p.visual_model_id) { unmapped.push(p); return; }
              var base = masterByCategory[cat].filter(function (b) { return b.id === p.visual_model_id; })[0];
              if (!base) { unmapped.push(p); return; }
              var item = JSON.parse(JSON.stringify(base));
              item.id = p.id;
              item.tenantProductId = p.id;
              item.externalId = p.external_id || null;
              item.visualModelId = p.visual_model_id;
              item.name = p.name || base.name;
              // Do not inherit the master catalog's baked-in price for a real
              // tenant - only show a price this tenant actually uploaded.
              item.pricePerDay = (p.price_per_day !== null && p.price_per_day !== undefined) ? Number(p.price_per_day) : null;
              item.isRealTenantProduct = true;
              resolved.push(item);
            });
            liveArrays[cat].length = 0;
            resolved.forEach(function (item) { liveArrays[cat].push(item); });
          });
          if (unmapped.length && window.console) {
            console.warn('RentSketch: tenant "' + tenantSlug + '" has ' + unmapped.length + ' active product(s) with no resolvable visual; excluded from the designer catalog until mapped in the dashboard.', unmapped.map(function (p) { return p.name; }));
          }
          if (window.FriendlyBridge && window.FriendlyBridge.state) {
            var fbState = window.FriendlyBridge.state;
            if (TENTS.length && !TENTS.some(function (t) { return t.id === fbState.tentId; })) fbState.tentId = TENTS[0].id;
            if (CHAIRS.length && !CHAIRS.some(function (c) { return c.id === fbState.chairId; })) fbState.chairId = CHAIRS[0].id;
          }
        tenant.tents = TENTS;
tenant.tables = TABLES;
tenant.chairs = CHAIRS;
} else {
          var byExternalId = {};
          data.products.forEach(function (p) { if (p.external_id) byExternalId[p.external_id] = p; });
          // IMPORTANT: mutate the shared TENTS/TABLES/CHAIRS catalog arrays (the
          // ones script.js actually renders from) - not tenant.tents/tables/chairs,
          // which are disconnected clones that nothing displays. Previously this
          // only updated the disconnected clones, so a tenant's uploaded prices
          // never actually reached the designer UI.
          var liveArraysStatic = { tent: TENTS, table: TABLES, chair: CHAIRS };
          [tenant.tents, tenant.tables, tenant.chairs].forEach(function (list) {
            if (!Array.isArray(list)) return;
            list.forEach(function (item) {
              var p = byExternalId[item.id];
              if (!p) return;
              if (p.name) item.name = p.name;
              if (p.price_per_day !== null && p.price_per_day !== undefined) item.pricePerDay = Number(p.price_per_day);
            });
          });
          Object.keys(liveArraysStatic).forEach(function (cat) {
            liveArraysStatic[cat].forEach(function (item) {
              var p = byExternalId[item.id];
              if (p) {
                if (p.name) item.name = p.name;
                item.pricePerDay = (p.price_per_day !== null && p.price_per_day !== undefined) ? Number(p.price_per_day) : null;
              } else {
                // No active tenant-uploaded price for this catalog item - do not
                // fall back to the master catalog's baked-in number.
                item.pricePerDay = null;
              }
            });
          });
        }
      })
      .catch(function () {});
    }
    
    if (window.RENTSKETCH_EMBED) {
      var _fetch = window.fetch;
      window.fetch = function (input, opts) {
        return _fetch(input, opts).then(function (res) {
          try {
            var urlStr = String(input);
            if (res.ok && opts && opts.method === 'POST') {
              if (urlStr.indexOf('/quote-requests') !== -1) {
                window.parent.postMessage({ type: 'rentsketch.quoteRequested' }, '*');
              } else if (urlStr.indexOf('/designs') !== -1) {
                window.parent.postMessage({ type: 'rentsketch.designSaved' }, '*');
              }
            }
          } catch (e) {}
          return res;
        });
      };
      
      // AUTO-START DESIGNER IN EMBED MODE: load default tent and enter designer
      var embedAutoStart = function() {
        if (typeof window.FriendlyBridge === 'undefined' || !window.FriendlyBridge.enterDesigner) {
          setTimeout(embedAutoStart, 50);
          return;
        }
        var tentId = TENTS.length ? TENTS[0].id : 'pole-20x20';
        window.FriendlyBridge.state.tentId = tentId;
        window.FriendlyBridge.enterDesigner();
      };
      setTimeout(embedAutoStart, 100);
      
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'rentsketch.ready', version: '1' }, '*');
        try {
          if ('ResizeObserver' in window) {
            var lastHeight = 0;
            var ro = new ResizeObserver(function () {
              var h = Math.ceil(document.body.scrollHeight);
              if (Math.abs(h - lastHeight) > 8) {
                lastHeight = h;
                window.parent.postMessage({ type: 'rentsketch.resize', height: h }, '*');
              }
            });
            ro.observe(document.body);
          }
        } catch (e) {}
      }
    }
    // Temporary diagnostics for cross-site embed freeze investigation (safe to remove once root cause is confirmed).
    (function () {
      if (window.parent === window) return;
      function rsDbg(evt, extra) {
        try {
          var payload = { type: 'rentsketch.debug', evt: evt, t: Date.now() };
          if (extra) { for (var k in extra) { payload[k] = extra[k]; } }
          window.parent.postMessage(payload, '*');
        } catch (e) {}
      }
      function activeStepId() {
        var el = document.querySelector('.step.active');
        return el ? el.id : null;
      }
      rsDbg('boot');
      document.addEventListener('DOMContentLoaded', function () { rsDbg('domcontentloaded'); });
      window.addEventListener('load', function () { rsDbg('winload'); });
      document.addEventListener('visibilitychange', function () { rsDbg('visibilitychange', { state: document.visibilitychange }); });
      ['pointerdown', 'pointerup', 'click'].forEach(function (type) {
        document.addEventListener(type, function (e) {
          rsDbg(type, { tag: e.target && e.target.tagName, step: activeStepId() });
        }, true);
      });
      window.addEventListener('error', function (e) {
        rsDbg('error', { msg: String((e && e.message) || e) });
      });
      window.addEventListener('unhandledrejection', function (e) {
        rsDbg('unhandledrejection', { reason: String(e && e.reason) });
      });
      var rsHbCount = 0;
      setInterval(function () {
        rsHbCount++;
        rsDbg('heartbeat', { n: rsHbCount, visible: document.visibilityState, step: activeStepId() });
      }, 1500);
    })();
    
  </script>

  <button type="button" id="btnPayDeposit" class="btn-primary" hidden>Pay D
